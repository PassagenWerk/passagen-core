default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-push]

      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-push]

      - id: pytest
        name: pytest parallel
        entry: uv run python scripts/pytest_parallel.py -q
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-push]
